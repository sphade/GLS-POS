name: Deploy

# Push-to-deploy for the GLS-POS backend + landing page, with D1 migrations
# applied automatically to the matching environment.
#
#   push to `main`     -> production backend + landing page, migrate gls-pos-control
#   push to `staging`  -> staging backend,                  migrate gls-pos-control-staging
#
# D1 migrations are applied as an EXPLICIT, LOGGED step AFTER a successful
# deploy, so a bad migration fails loudly in the Actions log instead of
# silently on a user's first request. Migrations are additive-only by
# convention (see .kiro learned rules): new tables/columns + backfill, never a
# destructive edit, so an already-shipped mobile app that does not call the new
# endpoints is unaffected.
#
# The per-store Durable Object SQLite migrations are NOT handled here: the
# StoreDurableObject runs drizzle's migrate() at startup, so DO schema changes
# ship inside the Worker bundle and apply themselves per store on next wake.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # One deploy per environment at a time; a newer push supersedes an in-flight run.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      d1: ${{ steps.pick.outputs.d1 }}
      wrangler_env: ${{ steps.pick.outputs.wrangler_env }}
      deploy_web: ${{ steps.pick.outputs.deploy_web }}
    steps:
      - id: pick
        shell: bash
        run: |
          # workflow_dispatch wins; otherwise derive from the pushed branch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVNAME="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVNAME="production"
          else
            ENVNAME="staging"
          fi

          if [ "$ENVNAME" = "production" ]; then
            echo "env=production"              >> "$GITHUB_OUTPUT"
            echo "d1=gls-pos-control"          >> "$GITHUB_OUTPUT"
            # Production is the top-level wrangler config (no --env flag).
            echo "wrangler_env="               >> "$GITHUB_OUTPUT"
            echo "deploy_web=true"             >> "$GITHUB_OUTPUT"
          else
            echo "env=staging"                 >> "$GITHUB_OUTPUT"
            echo "d1=gls-pos-control-staging"  >> "$GITHUB_OUTPUT"
            echo "wrangler_env=staging"        >> "$GITHUB_OUTPUT"
            # The landing page has no staging variant; only deploy it on prod.
            echo "deploy_web=false"            >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) Deploy the Worker first. If the deploy fails, we never touch the DB.
      - name: Deploy backend Worker
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ needs.resolve.outputs.wrangler_env }}" ]; then
            pnpm exec wrangler deploy --env ${{ needs.resolve.outputs.wrangler_env }}
          else
            pnpm exec wrangler deploy
          fi

      # 2) Apply any pending D1 migrations to THIS environment's database.
      #    `wrangler d1 migrations apply` is idempotent: it reads the d1_migrations
      #    bookkeeping table and runs only files not yet applied, so re-runs and
      #    no-op deploys are safe.
      - name: Apply D1 migrations
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply ${{ needs.resolve.outputs.d1 }} --remote

  deploy-web:
    needs: resolve
    if: needs.resolve.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing page
        run: pnpm --filter @gls-pos/web build
      - name: Deploy landing Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
