apply plugin: 'com.android.library'

group = 'expo.modules.bluetoothclassic'
version = '0.1.0'

// Use the Expo SDK's Android/Kotlin conventions and versions. This keeps the
// local module compatible with the host app's AGP, Kotlin, and compile SDK.
def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.bluetoothclassic"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
