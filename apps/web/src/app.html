<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14170f" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preconnect" href="https://azumi.com.ng" />
    <script>
      // Decide the motion mode before first paint so the opening sequence never flashes.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('cine');
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
