<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GLS Website CMS | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0f2a1b;--forest2:#163a26;--cream:#f5efe2;--paper:#fbf8f2;
  --lime:#9cc33b;--lime2:#b6d861;--ink:#191b16;--muted:#61655b;
  --line:rgba(25,27,22,.12);--danger:#b42318;--ok:#126b39;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
button,input,textarea{font:inherit}
a{color:inherit;text-decoration:none}

/* Login view */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--forest)}
.login-card{width:min(420px,100%);background:var(--paper);padding:2.4rem 2.2rem;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-brand{display:flex;align-items:center;gap:.8rem;margin-bottom:1.8rem}
.login-brand img{width:42px;height:42px;object-fit:contain}
.login-brand b{font:600 1.45rem/1 var(--serif);display:block;color:var(--forest)}
.login-brand small{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.login-card h1{font:500 2rem/1.1 var(--serif);color:var(--forest);margin-bottom:.4rem}
.login-card p.sub{font-size:.9rem;color:var(--muted);margin-bottom:1.6rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field textarea{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);font-size:.95rem}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--forest2);box-shadow:0 0 0 3px rgba(15,42,27,.1)}
.field textarea{min-height:88px;resize:vertical}
.err{background:#fef3f2;color:var(--danger);border:1px solid #fecdca;padding:.7rem .9rem;border-radius:3px;font-size:.86rem;margin-bottom:1rem;display:none}
.err.show{display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.72rem 1.25rem;border:1px solid transparent;border-radius:3px;font:600 .78rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-forest{background:var(--forest);color:var(--cream)}.btn-forest:hover:not(:disabled){background:var(--forest2)}
.btn-lime{background:var(--lime);color:var(--forest)}.btn-lime:hover:not(:disabled){background:var(--lime2)}
.btn-out{background:transparent;border-color:var(--line);color:var(--ink)}.btn-out:hover:not(:disabled){background:var(--cream)}
.btn-out-light{background:transparent;border-color:rgba(245,239,226,.3);color:var(--cream)}.btn-out-light:hover:not(:disabled){background:rgba(245,239,226,.1)}
.btn-sm{padding:.5rem .85rem;font-size:.72rem}
.btn-full{width:100%;padding:.9rem 1.25rem}

/* App shell */
.app{display:none;min-height:100vh;padding-bottom:6rem}
.app.show{display:block}
.topbar{position:sticky;top:0;z-index:20;background:var(--forest);color:var(--cream);border-bottom:1px solid rgba(245,239,226,.12)}
.topbar-in{max-width:1120px;margin:0 auto;padding:.9rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem}
.brand img{width:34px;height:34px;object-fit:contain}
.brand b{font:600 1.3rem/1 var(--serif);display:block}
.brand small{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}

.tabs-bar{background:var(--cream);border-bottom:1px solid var(--line)}
.tabs{max-width:1120px;margin:0 auto;padding:0 1.4rem;display:flex;gap:.2rem;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.95rem 1.1rem;font:600 .84rem/1 var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--forest)}
.tabs button.on{color:var(--forest);border-bottom-color:var(--lime)}

.main{max-width:1120px;margin:0 auto;padding:2rem 1.4rem}
.section-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.6rem;margin-bottom:1.5rem}
.section-card h2{font:500 1.65rem/1.1 var(--serif);color:var(--forest);margin-bottom:.25rem}
.section-card p.desc{font-size:.86rem;color:var(--muted);margin-bottom:1.3rem}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}
.grid-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
@media(max-width:720px){.grid-2{grid-template-columns:1fr}}

.field-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.field-head label{margin:0}
.reset-link{background:none;border:0;color:var(--muted);font-size:.74rem;cursor:pointer;text-decoration:underline;padding:0}
.reset-link:hover{color:var(--danger)}
.hint{font-size:.76rem;color:var(--muted);margin-top:.3rem}
.badge-custom{display:inline-block;background:rgba(156,195,59,.22);color:var(--forest);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:2px;margin-left:.4rem}

/* Image slot card */
.img-card{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.img-preview{aspect-ratio:16/10;background:#ebe3d2;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.82rem;text-align:center;padding:1rem}
.img-preview img{width:100%;height:100%;object-fit:cover;display:block}
.img-preview .uploading{position:absolute;inset:0;background:rgba(15,42,27,.72);color:var(--cream);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.img-meta{padding:.9rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.img-meta b{font-size:.9rem;color:var(--ink)}
.img-meta span{font-size:.76rem;color:var(--muted)}
.img-btns{display:flex;gap:.5rem;margin-top:auto;padding-top:.3rem}
.img-btns label.btn{cursor:pointer}
.img-btns input[type=file]{display:none}

/* Sticky save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--forest);color:var(--cream);padding:.9rem 1.4rem;box-shadow:0 -8px 28px rgba(0,0,0,.22);transform:translateY(120%);transition:.2s}
.savebar.show{transform:none}
.savebar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.savebar-in span{font-size:.9rem}

/* Toast */
.toast{position:fixed;top:4.8rem;right:1.4rem;z-index:40;background:var(--forest);color:var(--cream);padding:.8rem 1.15rem;border-radius:4px;border-left:4px solid var(--lime);box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:.88rem;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:none}
.toast.error{border-left-color:#f97066;background:#7a271a}
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="login-brand">
      <img src="img/logo.png" alt="GLS">
      <div><b>GLS Kitchen &amp; Bakery</b><small>Website CMS</small></div>
    </div>
    <h1>Admin Sign In</h1>
    <p class="sub">Sign in to edit website copy and upload new photos to Cloudflare R2.</p>
    <div class="err" id="loginErr"></div>
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" required placeholder="Admin username">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required placeholder="Admin password">
    </div>
    <button class="btn btn-forest btn-full" type="submit" id="loginBtn">Sign In</button>
  </form>
</div>

<div class="app" id="appView">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <img src="img/logo.png" alt="GLS">
        <div><b>GLS Website CMS</b><small id="whoLabel">Signed in</small></div>
      </div>
      <div class="actions">
        <a class="btn btn-out-light btn-sm" href="/" target="_blank" rel="noopener">View Live Site &#8599;</a>
        <button class="btn btn-lime btn-sm" id="topSaveBtn" type="button">Save Changes</button>
        <button class="btn btn-out-light btn-sm" id="logoutBtn" type="button">Sign Out</button>
      </div>
    </div>
  </header>

  <nav class="tabs-bar">
    <div class="tabs" id="tabBar"></div>
  </nav>

  <main class="main" id="editorRoot"></main>

  <div class="savebar" id="saveBar">
    <div class="savebar-in">
      <span id="dirtyLabel">You have unsaved changes.</span>
      <div class="actions">
        <button class="btn btn-out-light btn-sm" id="discardBtn" type="button">Discard</button>
        <button class="btn btn-lime btn-sm" id="barSaveBtn" type="button">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
